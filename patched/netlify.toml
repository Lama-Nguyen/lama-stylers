[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# Netlify Free tier: timeout tối đa 10 giây cho tất cả functions.
# withTimeoutGuard(8500ms) trong từng function đảm bảo AI call
# kết thúc gracefully trước khi Netlify hard-kill tại 10s.

[functions.generateOutfits]
  timeout = 10

[functions.analyzeClothing]
  timeout = 10

[functions.havySuggestOutfit]
  timeout = 10

[functions.enhanceClothingAnalysis]
  timeout = 10

[functions.generateStyleInsight]
  timeout = 10

[functions.removeBackground]
  timeout = 10

[functions.uploadImage]
  timeout = 10

[functions.deleteImage]
  timeout = 10

[functions.deleteImages]
  timeout = 10

[functions.getCloudinarySignature]
  timeout = 10

[functions.getWardrobe]
  timeout = 10

[functions.deleteClothing]
  timeout = 10

[functions.getNotifications]
  timeout = 10

[functions.sendFeedback]
  timeout = 10

[functions.redeemGiftCode]
  timeout = 10

[functions.deleteAccountData]
  timeout = 10

[functions.exportUserData]
  timeout = 10

[functions.getGenerationCreditsStatus]
  timeout = 10

[functions.cleanupTrigger]
  timeout = 10

[functions.health]
  timeout = 10

[functions.grantBonusGeneration]
  timeout = 10

[functions.sepayWebhook]
  timeout = 10

[[redirects]]
  from   = "/api/:fn"
  to     = "/.netlify/functions/:fn"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[dev]
  command    = "npm run dev"
  port       = 5173
  targetPort = 5173

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://*.firebaseapp.com
        https://*.googleapis.com
        https://pagead2.googlesyndication.com
        https://partner.googleadservices.com
        https://tpc.googlesyndication.com
        https://www.googletagservices.com
        https://www.google-analytics.com
        https://www.googletagmanager.com;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:
        https://res.cloudinary.com
        https://lh3.googleusercontent.com
        https://img.vietqr.io
        https://pagead2.googlesyndication.com
        https://www.google-analytics.com;
      connect-src 'self'
        https://*.netlify.app
        https://*.firebaseio.com
        https://*.googleapis.com
        https://api.cloudinary.com
        https://api.telegram.org
        https://sentry.io
        https://*.ingest.sentry.io
        https://www.google-analytics.com
        https://stats.g.doubleclick.net
        https://pagead2.googlesyndication.com
        wss://*.firebaseio.com;
      font-src 'self';
      frame-src
        https://*.firebaseapp.com
        https://googleads.g.doubleclick.net
        https://tpc.googlesyndication.com
        https://accounts.google.com;
    """

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
